<app-header></app-header>

<!-- Decorative animated elements -->
<div class="decorative-elements">
  <div class="floating-circle circle-1"></div>
  <div class="floating-circle circle-2"></div>
  <div class="floating-circle circle-3"></div>
  <div class="floating-circle circle-4"></div>
  <div class="floating-diamond diamond-1"></div>
  <div class="floating-diamond diamond-2"></div>
  <div class="floating-line line-1"></div>
  <div class="floating-line line-2"></div>
  <div class="pulsing-dot dot-1"></div>
  <div class="pulsing-dot dot-2"></div>
  <div class="pulsing-dot dot-3"></div>
</div>

<div class="press-release-container animate-fade-in-up">
  <div class="protector-breadcrumb">
    <a  class="breadcrumb-link">Home</a>
    <span class="breadcrumb-separator">/</span>
    <a  class="breadcrumb-link">Media Center</a>
    <span class="breadcrumb-separator">/</span>
    <a  class="breadcrumb-link">News</a>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-current">Press Release</span>
  </div>
  <h1 class="press-release-title">Official Statements from OEC to the Public & Media</h1>

  <section class="press-release-section" *ngIf="!isLoading && pressReleases.length > 0">
    <h2 class="press-release-section-title">Press Releases</h2>
    <div class="press-releases-list">
      <div class="press-release-card" *ngFor="let release of pressReleases">
        <div class="press-release-header">
          <div class="press-release-date" *ngIf="release.date">
            {{release.date}}
          </div>
          <div class="press-release-category" *ngIf="release.category" [class]="'category-' + release.category.toLowerCase()">
            {{release.category}}
          </div>
          <span class="urgent-tag" *ngIf="release.is_urgent">Urgent</span>
        </div>
        <div class="press-release-title-section">
          <h3 class="press-release-headline">{{release.headline}}</h3>
          <div class="press-release-summary" *ngIf="release.summary">
            {{release.summary}}
          </div>
        </div>
        <div class="press-release-actions">
          <a *ngIf="release.pdf_link" [href]="release.pdf_link" class="action-button pdf-button" target="_blank">
            View Link
          </a>
          <a *ngIf="release.read_link" [href]="release.read_link" class="action-button read-button" target="_blank">
            Read Full Statement
          </a>
        </div>
      </div>
    </div>
  </section>

  <div class="empty-message" *ngIf="!isLoading && pressReleases.length === 0">
    <p>No press releases available at the moment. Please check back later.</p>
  </div>
</div>

<app-footer></app-footer>
